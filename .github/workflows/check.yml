name: Check

on:
  pull_request:
    branches: [beta, master]
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # composition-label and operation-work-apply probes build an old commit's tree
          # (`git show <sha>:path`); a depth-1 clone has no such object.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      # step-roundtrip-probe shells out to the ast-grep binary; pinned to the local version (0.45.1).
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.1 && ast-grep --version
      - name: Run quality gate
        run: ./scripts/ci-check.sh

  mannequin-beta:
    name: Mannequin beta gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run mannequin beta gate
        run: yarn test:mannequin:ci
      # The gate stops at the first red browser suite, so test-results/ then holds exactly that
      # suite's trace, screenshot and error context. Without them a CI-only flake is a guess.
      - name: Upload mannequin gate failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mannequin-gate-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
